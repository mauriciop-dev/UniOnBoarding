<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ProOnboarding — permiso de microfono</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 460px; margin: 48px auto; padding: 0 20px; color: #1f2933; }
    h1 { font-size: 20px; }
    button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #status { margin-top: 14px; font-size: 14px; color: #4b5563; }
  </style>
</head>
<body>
  <h1>Permiso de microfono de ProOnboarding</h1>
  <p>Para usar el Modo Voz (hablar con el asistente) hace falta el microfono.</p>
  <button id="ask">Pedir permiso de microfono</button>
  <div id="meter" hidden>
    <p id="meterLabel"></p>
    <div style="width:100%;height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;">
      <div id="meterBar" style="width:0%;height:100%;background:#22c55e;"></div>
    </div>
  </div>
  <p id="status"></p>
  <script src="request-mic.js"></script>
</body>
</html>
